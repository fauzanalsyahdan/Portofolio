    function openLightbox(image) {
        lightboxImage.src = image.dataset.fullSrc || image.src;
        lightboxImage.alt = image.alt || 'Gambar proyek';
        lightbox.classList.add('show');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.classList.add('lightbox-open');
        lightboxClose.focus();
    }

    function closeLightbox() {
        lightbox.classList.remove('show');
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImage.src = '';
        document.body.classList.remove('lightbox-open');
    }

    document.getElementById('csGallery').addEventListener('click', function (event) {
        const image = event.target.closest('.gallery-image');
        if (image) openLightbox(image);
    });

    document.getElementById('csGallery').addEventListener('keydown', function (event) {
        const image = event.target.closest('.gallery-image');
        if (image && (event.key === 'Enter' || event.key === ' ')) {
            event.preventDefault();
            openLightbox(image);
        }
    });

    lightboxClose.addEventListener('click', closeLightbox);

    // Klik area gelap di luar gambar juga menutup popup.
    lightbox.addEventListener('click', function (event) {
        if (event.target === lightbox) closeLightbox();
    });

    // Tombol Escape untuk menutup popup.
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && lightbox.classList.contains('show')) {
            closeLightbox();
        }
    });
</script>
